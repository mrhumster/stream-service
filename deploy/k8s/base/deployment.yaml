apiVersion: apps/v1
kind: Deployment
metadata:
  name: stream-service
  namespace: go-app
  labels:
    app: stream-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stream-service
  template:
    metadata:
      labels:
        app: stream-service
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: stream
          image: xomrkob/stream:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: stream-service-config
            - configMapRef:
                name: go-app-config
            - secretRef:
                name: go-app-secret
            - secretRef:
                name: minio-credentials
            - secretRef:
                name: casbin-redis
            - secretRef:
                name: faces-internal-token
          env:
            - name: GRPC_TLS_ENABLED
              value: "true"
            - name: GRPC_TLS_CERT
              value: "/tls/grpc/tls.crt"
            - name: GRPC_TLS_KEY
              value: "/tls/grpc/tls.key"
            - name: GRPC_TLS_CA
              value: "/tls/grpc/ca.crt"
            - name: GRPC_TLS_ALLOWED_OUS
              value: "thumbnail-service,transcoder-service,faces-service"
          volumeMounts:
            - name: grpc-tls
              mountPath: /tls/grpc
              readOnly: true

          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: stream/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: stream/health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: grpc-tls
          secret:
            secretName: grpc-stream-tls
